{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header" style="background: linear-gradient(135deg, #6a1b9a, #9c27b0); color: white;">
                <h4 class="mb-0"><i class="fas fa-plus-circle"></i> Ajouter une nouvelle dépense</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="amount" class="form-label">Montant (Fcfa)</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="category" class="form-label">Catégorie</label>
                        <select class="form-control" id="category" name="category" required>
                            <option value="">Sélectionnez une catégorie</option>
                            <option value="Alimentation">🍔 Alimentation</option>
                            <option value="Transport">🚗 Transport</option>
                            <option value="Loisirs">🎮 Loisirs</option>
                            <option value="Santé">🏥 Santé</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Factures">📄 Factures</option>
                            <option value="Autre">📌 Autre</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <!-- CORRECTION : Supprimer datetime.now() -->
                        <input type="date" class="form-control" id="date" name="date">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-save"></i> Enregistrer la dépense
                    </button>
                </form>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-body bg-light">
                <h5><i class="fas fa-lightbulb"></i> Conseil du jour</h5>
                <p>Suivre vos dépenses quotidiennes vous aide à mieux gérer votre budget. Essayez de catégoriser chaque dépense pour une meilleure analyse !</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
