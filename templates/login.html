{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header" style="background: linear-gradient(135deg, #6a1b9a, #9c27b0); color: white;">
                <h4><i class="fas fa-sign-in-alt"></i> Connexion</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nom d'utilisateur</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('register') }}">Pas encore de compte ? S'inscrire</a>
                </div>
                <hr>
                <div class="alert alert-info">
                    <strong>Compte de test:</strong><br>
                    Utilisateur: testuser / test123<br>
                    Admin: admin / admin123
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
